name: Promote image

# #65: a release tags `X.Y.Z` and `beta`, never `latest`, so a beta that bumps the
# wire protocol cannot reach directory users. Only this job moves `latest`, and only
# onto an image that already exists: `imagetools create` copies the released index, so
# the tag resolves to the exact digest `release.yml` (and its attestation) covers.
#
# Called by `deno task promote X.Y.Z` (scripts/promote.ts), which waits for this run.
#
# Maintainer-only by design: a manual dispatch skips the preconditions promote.ts checks
# (clean main, a pre-release, above the promoted version). It only retags.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "The released X.Y.Z whose image becomes latest"
        required: true
        type: string

permissions:
  contents: read
  packages: write

# scripts/promote.ts finds this run by this name: keep the two in step.
run-name: Promote image ${{ inputs.version }}

concurrency:
  group: promote-image
  cancel-in-progress: false

jobs:
  retag:
    name: Retag latest
    # GitHub-hosted, like the manifest merge in release.yml: the job only needs Docker.
    runs-on: ubuntu-latest
    steps:
      - name: Validate the version
        env:
          VERSION: ${{ inputs.version }}
        # The whole value, not line by line: `grep -qxE` still accepts a multi-line input
        # whose first line is a version.
        run: |
          if [[ ! $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be X.Y.Z, got '$VERSION'"
            exit 1
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag latest onto the released digest
        env:
          VERSION: ${{ inputs.version }}
        # No build, no push of new bytes: the same index, one more tag. `release.yml`
        # attests the digest of X.Y.Z, so a different digest behind `latest` would ship an
        # image with no provenance record.
        run: |
          source_image="ghcr.io/hrt-htk/geode:$VERSION"
          before=$(docker buildx imagetools inspect "$source_image" --format '{{.Manifest.Digest}}')
          docker buildx imagetools create --tag ghcr.io/hrt-htk/geode:latest "$source_image"
          after=$(docker buildx imagetools inspect ghcr.io/hrt-htk/geode:latest \
            --format '{{.Manifest.Digest}}')
          if [ "$after" != "$before" ]; then
            echo "::error::latest is $after, but $VERSION is $before: the retag changed the digest"
            exit 1
          fi
          echo "latest -> $after"
